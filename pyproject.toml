[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "corporate-financial-deterioration"
version = "0.1.0"
description = "Point-in-time early-warning platform for corporate debt-service deterioration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Anish Saripella" }]
dependencies = [
  "dagster>=1.8,<2",
  "dagster-webserver>=1.8,<2",
  "duckdb>=1.1,<2",
  "fredapi>=0.5.2,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.9,<4",
  "mlflow>=2.17,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pandera>=0.20,<1",
  "pyarrow>=17,<20",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pandas-stubs>=2.2,<3",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
cfd = "cfd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cfd"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=cfd --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "network: requires access to a public external API",
  "slow: long-running validation or modeling test",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
"scripts/generate_publication_report.py" = ["E501", "E702"]

[tool.mypy]
python_version = "3.12"
packages = ["cfd"]
strict = true
warn_unreachable = true

[tool.coverage.run]
branch = true
source = ["cfd"]
